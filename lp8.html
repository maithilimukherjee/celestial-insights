<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path 8</title>
</head>
<body>
    <div class="life-path">
        <h1>Your Life Path Number is 8!</h1>
        <h4>~ The powerhouses of the universe! ~</h4>
        <div class="life-path-img">
            <img src="./saturn.gif" alt="Life Path 8 Gif">
        </div>
        <button id="readMore">Read More</button>
        <div class="text">
            <p id="lifePath8Text"></p>
        </div>
    </div>
    
    <style>

        body {
            background-color: rgb(0, 0, 0);
            color: rgb(243, 245, 125);
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            
        }

        h1, h4 {
            color: gold; /* Change header color to red */
        }

        img {
            border-radius: 15px;
            border: none;
            margin-top: 10px;
            height: 300px;
            width: 400px;
        }

        img:hover {
            transform: scale(1.11);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(203, 219, 52, 0.5);
        }

        .life-path {
            margin-top: 30px;
            background-color: rgb(0, 0, 0);
            padding: 20px;
            border-radius: 20px;
        }

        p {
            font-size: 18px;
            color: greenyellow; 
            text-align: left;
        }

        #readMore {
            border: none;
            background-color: black;
            padding: 12px;
            color: white;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 1em;
            border-radius: 20px;
            margin-top: 20px; 
            cursor: pointer;
        }

        #readMore:hover {
            background-color: limegreen;
            color: rgb(2, 1, 1);
            transform: scale(1.09);
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            h4 {
                font-size: 1em;
            }

            img {
                width: 80%;
                height: auto;
            }

            .life-path {
                padding: 8px;
                margin-top: 10px;
            }

            #readMore {
                font-size: 0.8em;
                padding: 8px;
            }

            p {
                font-size: 14px;
                text-align: left;
            }
        }
    </style>

    <script>
        const lifePath8 = `ruling planet: saturn. 
                           key traits: ambitious, authoritative, confident, disciplined, strategic, practical, powerful, goal-oriented, resilient, efficient, driven, assertive, organized, commanding, successful. 
                           compatible with: 3,4,5,6`;

        let i = 0; 
        const speed = 42; 

        const readMoreBtn = document.getElementById("readMore");

        readMoreBtn.addEventListener("click", () => {
            readMoreBtn.style.display = "none";
            typeWriter();
        });

        function typeWriter() {
            if (i < lifePath8.length) {
                document.getElementById("lifePath8Text").innerHTML += lifePath8.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }
    </script>
</body>
</html>

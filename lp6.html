<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path 6</title>
</head>
<body>
    <div class="venus">
        <h1>Your Life Path Number is 6!</h1>
        <h4>~ very demure, very classy ~</h4>
        <div class="venusimg">
            <img src="./venus.gif" alt="Venus Gif">
        </div>
        <button id="readMore">Read More</button>
        <div class="text">
            <p id="venusBaby"></p>
        </div>
    </div>
    
    <style>

        body {
            background-color: black;
            color: bisque;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: linearGradient 10s infinite; 
        }

        h1{
            margin-top: 10px;
        }
        img {
            border-radius: 15px;
            border: none;
            margin-top: 10px;
            height: 330px;
            width: 330px;
            mix-blend-mode: screen;
        }

        img:hover {
            transform: scale(1.11);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(236, 234, 86, 0.5);
        }

        .venus {
            margin-top: 50px;
            background-color: black;
            padding: 20px;
            border-radius: 20px;
        }

        p {
            font-size: 18px;
            text-align: left;
        }

        #readMore {
            border: none;
            background-color: black;
            padding: 12px;
            color: bisque;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 1em;
            border-radius: 20px;
            margin-top: 20px; 
            cursor: pointer;
        }

        #readMore:hover {
            background-color: bisque;
            color: black;
            transform: scale(1.09);
            transition: background-color 0.5s ease, color 0.5s ease;
        }
    </style>

    <script>
        const lifePath6 = `ruling planet: venus. 
                           key traits: nurturing, responsible, loving, protective, loyal, compassionate, supportive, harmonious, empathetic, idealistic, reliable, generous, devoted, gentle, domestic. 
                           compatible with: 4,5,6,7,8`;

        let i = 0; 
        const speed = 42; 

        const readMoreBtn = document.getElementById("readMore");

        readMoreBtn.addEventListener("click", () => {
            readMoreBtn.style.display = "none";
            typeWriter();
        });

        function typeWriter() {
            if (i < lifePath6.length) {
                document.getElementById("venusBaby").innerHTML += lifePath6.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path 4</title>
</head>
<body>
    <div class="rahu">
    <h1>Your Life Path Number is 4!</h1>
    <h4>~ you do not tell them what to do. ~</h4>
    <div class="rahuimg">
        <img src="./angelina-jolie-gif.gif">
    </div>
    <button id="readMore">Read More</button>
    <div class="text">
        <p id="rahuBaby"></p>
    </div>
</div>
<style>
    
    @keyframes linearGradient {
    0% { background-color: rgb(17, 16, 16); }
    50% { background-color: rgb(24, 18, 16); }
    100% { background-color: rgb(3, 3, 3); }
}

body {
    background-color: black;
    color: bisque;
    font-family: 'Times New Roman', Times, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: linearGradient 10s infinite; 
}

    img{
        border-radius: 15px;
        border: none;
        margin-top: 10px;
        height: 300px;
        width: 300px;
    }
    img:hover{
        transform: scale(1.11);
        cursor: pointer;
        box-shadow: 0 0 10px rgba(39, 2, 2, 0.5);
    }
    .rahu{
        margin-top: 50px;
        background-color: rgb(12, 12, 12);
        padding: 20px;
        border-radius: 20px;
        
    }
    p{
        font-size: 18px;
        text-align: left;
    }
    #readMore {
            border: none;
            background-color: black;
            padding: 12px;
            color: bisque;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 1em;
            border-radius: 20px;
            margin-top: 20px; 
            cursor: pointer;
        }

        #readMore:hover {
            background-color: bisque;
            color: black;
            transform: scale(1.09);
            transition: background-color 0.5s ease, color 0.5s ease;
        }
    
</style>
<script>

    const lifePath4 = `Life Path 4 individuals are grounded, hardworking, and reliable, with a strong appreciation for beauty and elegance. They thrive in careers where they can combine structure with artistry, such as engineering or architecture. Their taste often reflects a preference for timeless craftsmanship and quality, valuing enduring success built on a solid foundation. Despite their methodical nature, they find satisfaction in adding an artistic touch to everything they create, whether in their professional or personal endeavors. Their sense of discipline and attention to detail make them natural creators and problem-solvers.`;

    let i = 0; 
    const speed = 42; 

    const readMoreBtn = document.getElementById("readMore");

    readMoreBtn.addEventListener("click", () => {
        readMoreBtn.style.display = "none";
        typeWriter();
    });

    function typeWriter() {
        if (i < lifePath4.length) {
            document.getElementById("rahuBaby").innerHTML += lifePath4.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }

</script>
</body>
</html>

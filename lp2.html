<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path 2</title>
</head>
<body>
    <div class="moon">
    <h1>Your Life Path Number is 2!</h1>
    <h4>~ Alexa, play Moonlight by Kali Uchis ~</h4>
    <div class="moonimg">
        <img src="./moon.gif">
    </div>
    <button id="readMore">Read More</button>
    <div class="text">
        <p id="moonBaby"></p>
    </div>
</div>
<style>
    body{
        background-color: black;
        background-image: url(./moon.gif);
        background-repeat: no-repeat;
        background-size: cover;
        color: bisque;
        font-family: 'Times New Roman', Times, serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    img{
        border-radius: 15px;
        border: none;
        margin-top: 10px;
    }
    img:hover{
        transform: scale(1.11);
        cursor: pointer;
        box-shadow: 0 0 20px rgba(192, 183, 183, 0.5);
    }
    .moon{
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    p{
        font-size: 15px;
        text-align: left;
    }
    #readMore {
            border: none;
            background-color: black;
            padding: 12px;
            color: bisque;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 1em;
            border-radius: 20px;
            margin-top: 20px; 
            cursor: pointer;
        }

        #readMore:hover {
            background-color: bisque;
            color: black;
            transform: scale(1.09);
            transition: background-color 0.5s ease, color 0.5s ease;
        }
    @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            h4 {
                font-size: 1.2em;
            }

            img {
                width: 90%;
                height: auto;
            }

            .life-path {
                padding: 10px;
                margin-top: 20px;
            }

            #readMore {
                font-size: 0.9em;
                padding: 10px;
            }

            p {
                font-size: 16px;
             }
         }

        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            h4 {
                font-size: 1em;
            }

            img {
                width: 80%;
                height: auto;
            }

            .life-path {
                padding: 8px;
                margin-top: 10px;
            }
#readMore {
                font-size: 0.8em;
                padding: 8px;
            }

            p {
                font-size: 14px;
            }
        }
    

    
</style>
<script>

    const lifePath2 = `gentle, intuitive, diplomatic, empathetic, patient, cooperative, sensitive, supportive, loyal, peace-loving, tactful, considerate, harmonious, emotional, humble
                       compatible with: 1, 4, 6, 8 (sometimes 9 if the emotions don’t flood the boat)`;

    let i = 0; 
    const speed = 50; 

    const readMoreBtn = document.getElementById("readMore");

    readMoreBtn.addEventListener("click", () => {
        readMoreBtn.style.display = "none";
        typeWriter();
    });

    function typeWriter() {
        if (i < lifePath2.length) {
            document.getElementById("moonBaby").innerHTML += lifePath2.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }

</script>
</body>
</html>

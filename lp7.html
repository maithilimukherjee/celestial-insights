<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path 7</title>
</head>
<body>
    <div class="life-path">
        <h1>Your Life Path Number is 7!</h1>
        <h4>~ The seekers of truth and wisdom ~</h4>
        <div class="life-path-img">
            <img src="./ketu.gif" alt="Life Path 7 Gif">
        </div>
        <button id="readMore">Read More</button>
        <div class="text">
            <p id="lifePath7Text"></p>
        </div>
    </div>
    
    <style>
        @keyframes linearGradient {
            0% { background-color: rgb(255, 255, 255); }
            50% { background-color: rgb(240, 240, 240); }
            100% { background-color: rgb(255, 255, 255); }
        }

        body {
            background-color: white;
            color: black;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: linearGradient 10s infinite; 
        }

        h1, h4 {
            color: red; 
        }

        img {
            border-radius: 15px;
            border: none;
            margin-top: 10px;
            height: 300px;
            width: 400px;
        }

        img:hover {
            transform: scale(1.11);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(236, 34, 86, 0.5);
        }

        .life-path {
            margin-top: 50px;
            background-color: rgb(240, 240, 240);
            padding: 20px;
            border-radius: 20px;
            max-width: 80%;
        }

        p {
            font-size: 18px;
            color: black; 
            text-align: left;
        }

        #readMore {
            border: none;
            background-color: black;
            padding: 12px;
            color: white;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 1em;
            border-radius: 20px;
            margin-top: 20px; 
            cursor: pointer;
        }

        #readMore:hover {
            background-color: red;
            color: white;
            transform: scale(1.09);
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            h4 {
                font-size: 1.2em;
            }

            img {
                width: 90%;
                height: auto;
            }

            .life-path {
                padding: 10px;
                margin-top: 20px;
            }

            #readMore {
                font-size: 0.9em;
                padding: 10px;
            }

            p {
                font-size: 16px;
                text-align: left;
            }
        }

        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            h4 {
                font-size: 1em;
            }

            img {
                width: 80%;
                height: auto;
            }

            .life-path {
                padding: 8px;
                margin-top: 10px;
            }

            #readMore {
                font-size: 0.8em;
                padding: 8px;
            }

            p {
                font-size: 14px;
                text-align: left;
            }
        }
    </style>

    <script>
        const lifePath7 = `key traits: introspective, analytical, spiritual, intellectual, reserved, intuitive, mysterious, independent, philosophical, wise, curious, private, observant, thoughtful, skeptical
                           compatible with: 2,3,4,7`;

        let i = 0; 
        const speed = 42; 

        const readMoreBtn = document.getElementById("readMore");

        readMoreBtn.addEventListener("click", () => {
            readMoreBtn.style.display = "none";
            typeWriter();
        });

        function typeWriter() {
            if (i < lifePath7.length) {
                document.getElementById("lifePath7Text").innerHTML += lifePath7.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path 5</title>
</head>
<body>
    <div class="mercury">
    <h1>your life path number is 5!</h1>
    <h4>~ certified celestial vagabonds ~</h4>
    <div class="mercuryimg">
        <img src="./mercury-3.gif">
    </div>
    <button id="readMore">Read More</button>
    <div class="text">
        <p id="mercuryBaby"></p>
    </div>
</div>
<style>
    
    @keyframes linearGradient {
    0% { background-color: rgb(1, 9, 22); }
    50% { background-color: rgb(24, 18, 16); }
    100% { background-color: rgb(3, 1, 15); }
}

body {
    background-color: black;
    color: bisque;
    font-family: 'Times New Roman', Times, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: linearGradient 10s infinite; 
}

    img{
        border-radius: 15px;
        border: none;
        margin-top: 10px;
        height: 300px;
        width: 400px;
        mix-blend-mode: screen;
    }
    img:hover{
        transform: scale(1.11);
        cursor: pointer;
        box-shadow: 0 0 20px rgba(236, 234, 86, 0.5);
    }
    .rahu{
        margin-top: 50px;
        background-color: rgb(12, 12, 12);
        padding: 20px;
        border-radius: 20px;
        
    }
    p{
        font-size: 18px;
        text-align: left;
    }
    #readMore {
            border: none;
            background-color: black;
            padding: 12px;
            color: bisque;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 1em;
            border-radius: 20px;
            margin-top: 20px; 
            cursor: pointer;
        }

        #readMore:hover {
            background-color: bisque;
            color: black;
            transform: scale(1.09);
            transition: background-color 0.5s ease, color 0.5s ease;
        }



        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            h4 {
                font-size: 1.2em;
            }

            img {
                width: 90%;
                height: auto;
            }

            .life-path {
                padding: 10px;
                margin-top: 20px;
            }

            #readMore {
                font-size: 0.9em;
                padding: 10px;
            }

            p {
                font-size: 16px;
                text-align: left;
            }
        }

        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            h4 {
                font-size: 1em;
            }

            img {
                width: 80%;
                height: auto;
            }

            .life-path {
                padding: 8px;
                margin-top: 10px;
            }

            #readMore {
                font-size: 0.8em;
                padding: 8px;
            }

            p {
                font-size: 14px;
                text-align: left;
            }
        }
    
</style>
<script>

    const lifePath5 = `ruling planet: mercury. 
                       key traits: adventurous, curious, energetic, adaptable, freedom-loving, spontaneous, charismatic, dynamic, witty, versatile, sociable, fearless, expressive, bold, impulsive.
                       compatible with: 1,3,4,5,6`;

    let i = 0; 
    const speed = 42; 

    const readMoreBtn = document.getElementById("readMore");

    readMoreBtn.addEventListener("click", () => {
        readMoreBtn.style.display = "none";
        typeWriter();
    });

    function typeWriter() {
        if (i < lifePath5.length) {
            document.getElementById("mercuryBaby").innerHTML += lifePath5.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        }
    }

</script>
</body>
</html>

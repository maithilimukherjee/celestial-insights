<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Path 9</title>
</head>
<body>
    <div class="life-path">
        <h1>Your Life Path Number is 9!</h1>
        <h4>~ The passionate humanitarians! ~</h4>
        <div class="life-path-img">
            <img src="./mars.gif" alt="Life Path 9 Gif">
        </div>
        <button id="readMore">Read More</button>
        <div class="text">
            <p id="lifePath9Text"></p>
        </div>
    </div>
    
    <style>
        @keyframes linearGradient {
            0% { background-color: rgb(36, 11, 11); }
            50% { background-color: rgb(0, 0, 0); }
            100% { background-color: rgb(43, 1, 1); }
        }

        body {
            background-color: rgb(27, 6, 6);
            color: black;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: linearGradient 10s infinite; 
        }

        h1, h4 {
            color: red; 
        }

        img {
            border-radius: 15px;
            border: none;
            margin-top: 10px;
            height: 270px;
            width: 270px;
            
        }

        img:hover {
            transform: scale(1.11);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(236, 34, 86, 0.5);
        }

        .life-path {
            margin-top: 50px;
            background-color: rgb(0, 0, 0);
            padding: 20px;
            border-radius: 20px;
        }

        p {
            font-size: 18px;
            color: indianred;
            text-align: left;
        }

        #readMore {
            border: none;
            background-color: black;
            padding: 12px;
            color: white;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 1em;
            border-radius: 20px;
            margin-top: 20px; 
            cursor: pointer;
        }

        #readMore:hover {
            background-color: red;
            color: white;
            transform: scale(1.09);
            transition: background-color 0.5s ease, color 0.5s ease;
        }
    </style>

    <script>
        const lifePath9 = `ruling planet: mars. 
                           key traits: compassionate, idealistic, generous, intuitive, artistic, wise, empathetic, humanitarian, emotional, forgiving, tolerant, selfless, spiritual, dreamy, graceful. 
                           compatible with: 1,3,7,9`;

        let i = 0; 
        const speed = 42; 

        const readMoreBtn = document.getElementById("readMore");

        readMoreBtn.addEventListener("click", () => {
            readMoreBtn.style.display = "none";
            typeWriter();
        });

        function typeWriter() {
            if (i < lifePath9.length) {
                document.getElementById("lifePath9Text").innerHTML += lifePath9.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }
    </script>
</body>
</html>
